<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#111111">
    <meta name="mobile-web-app-capable" content="yes">
    <title>walow game - محرك الألعاب</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; font-family: Tahoma, sans-serif; }
        body { display: flex; flex-direction: column; height: 100dvh; }

        #game-container { width: 100%; flex: 55 1 0; min-height: 0; position: relative; background: #222; overflow: hidden; }
        #chat-container { width: 100%; flex: 45 1 0; min-height: 0; background: #181818; display: flex; flex-direction: column; border-top: 2px solid #333; }
        body.big-game #game-container { flex-grow: 80; }
        body.big-game #chat-container { flex-grow: 20; }

        #toolbar { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; z-index: 6; }
        #toolbar button { width: 38px; height: 38px; border-radius: 10px; border: none; background: rgba(0,0,0,.55); color: #fff; font-size: 18px; cursor: pointer; }

        #preview-box { display: none; padding: 6px 10px; background: #222; align-items: center; gap: 8px; border-bottom: 1px solid #333; flex-wrap: wrap; }
        #upload-preview { max-height: 44px; border-radius: 4px; }
        #preview-box button, #preview-box select { border: none; border-radius: 4px; padding: 6px 9px; font-size: 12px; cursor: pointer; }
        #preview-box .del { background: #c62828; color: #fff; }
        #preview-box .to3d { background: #00ffcc; color: #000; font-weight: bold; }
        #preview-box select { background: #333; color: #fff; }

        #chat-messages { flex: 1; overflow-y: auto; padding: 10px; font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
        .msg { padding: 8px 12px; border-radius: 8px; max-width: 88%; word-break: break-word; line-height: 1.5; white-space: pre-wrap; }
        .msg.user { background: #007acc; color: #fff; align-self: flex-end; }
        .msg.ai { background: #2a2a2a; color: #ddd; align-self: flex-start; }
        details.msg summary { cursor: pointer; color: #00ffcc; }

        .opts { display: flex; align-items: center; gap: 6px; padding: 4px 10px 0; font-size: 11px; color: #999; }
        .input-bar { display: flex; padding: 8px 10px; background: #202020; gap: 6px; align-items: center; }
        .input-bar input[type="text"] { flex: 1; min-width: 0; padding: 10px; border-radius: 6px; border: none; background: #2d2d2d; color: #fff; outline: none; font-size: 14px; }
        .input-bar button { padding: 10px 14px; background: #00ffcc; color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .input-bar .icon-btn { background: #333; color: #fff; padding: 10px 11px; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="toolbar">
            <button onclick="openSettings()" title="الإعدادات">⚙️</button>
            <button onclick="undoLast()" title="تراجع">↩️</button>
            <button onclick="clearAll()" title="مسح">🗑️</button>
            <button onclick="togglePanel()" title="تكبير/تصغير اللعبة">⇕</button>
        </div>
    </div>

    <div id="chat-container">
        <div id="preview-box">
            <img id="upload-preview" src="" alt="Preview">
            <button class="to3d" onclick="convertImageTo3D()">🧊 حوّلها إلى 3D</button>
            <select id="mode-select">
                <option value="relief">تضاريس</option>
                <option value="standee">قصاصة بدون خلفية</option>
                <option value="voxel">مكعبات</option>
            </select>
            <button class="del" onclick="clearImage()">حذف</button>
            <span style="font-size:11px;color:#aaa">أو اكتب رسالة لإرسالها للذكاء الاصطناعي (مثلاً: أصلح الكود في الصورة)</span>
        </div>

        <div id="chat-messages">
            <div class="msg ai">أهلاً بك في محرك walow game! ⚙️ أدخل مفتاح Gemini من أعلى الشاشة، ثم اطلب مني ما تريد بناءه (مثلاً: «ابنِ مدينة صغيرة وعملات أجمعها»). اسحب الشاشة لتدوير الكاميرا، واستخدم 🖼️ أو 📸 لإرسال صورة لإصلاح كود أو لتحويلها إلى 3D.</div>
        </div>

        <div class="opts"><label><input type="checkbox" id="share-view"> 👁 أرِ الذكاء الاصطناعي شاشة اللعبة</label></div>
        <div class="input-bar">
            <input type="file" id="image-input" accept="image/*" style="display:none;" onchange="handleImage(event)">
            <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none;" onchange="handleImage(event)">
            <button class="icon-btn" onclick="document.getElementById('image-input').click()" title="صورة من المعرض">🖼️</button>
            <button class="icon-btn" onclick="document.getElementById('camera-input').click()" title="التقاط بالكاميرا">📸</button>
            <input type="text" id="chat-input" placeholder="اطلب بناء لعبة أو تعديل المشهد..." autocomplete="off" />
            <button onclick="handleUserSubmit()">إرسال</button>
        </div>
    </div>

    <script src="engine.js?v=1"></script>
    <script src="ai-bridge.js?v=1"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js').catch(function (e) { console.log('SW registration failed:', e); });
            });
        }
    </script>
</body>
</html>
